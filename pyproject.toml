[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hatua"
version = "0.1.0"
description = "Trust-gated action layer on Conduit@Empathy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pydantic>=2.0",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.9",
  "typesafe-sdk>=0.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["packages/core"]

[tool.setuptools.package-data]
hatua_core = ["policy/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["packages/core"]
testpaths = ["tests"]
